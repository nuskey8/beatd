[package]
name = "beatd"
version.workspace = true
edition = "2024"
description = "A cross-platform library for Streaming audio analysis."
license = "MIT"
readme = "../README.md"
repository = "https://github.com/nuskey8/beatd"
homepage = "https://github.com/nuskey8/beatd"
documentation = "https://docs.rs/beatd"
keywords = ["audio", "bpm", "beat-detection", "fft", "wasm"]
categories = ["multimedia::audio"]

[dependencies]
rustfft = "6"
wasm-bindgen = { version = "0.2", optional = true }

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
ffi = []
wasm = ["dep:wasm-bindgen"]

[build-dependencies]
csbindgen = "1.9.8"
