name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  build-desktop:
    needs: verify
    uses: ./.github/workflows/build-desktop.yml

  publish-npm:
    needs: verify
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm.yml
    with:
      version: ${{ needs.verify.outputs.version }}

  publish-nuget:
    needs: verify
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-nuget.yml
    with:
      version: ${{ needs.verify.outputs.version }}
    secrets: inherit

  publish-cargo:
    needs: verify
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-cargo.yml
    with:
      version: ${{ needs.verify.outputs.version }}

  create-release:
    needs: [verify, build-desktop]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/create-release.yml
    with:
      version: ${{ needs.verify.outputs.version }}
      run_id: ${{ github.run_id }}
